name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-xp-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-xp-ai/frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm install
      - name: Run Jest
        run: npm test -- --runInBand

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ai-calendar-xp-backend ./calendar-xp-ai/backend
      - name: Build frontend image
        run: docker build -t ai-calendar-xp-frontend ./calendar-xp-ai/frontend
