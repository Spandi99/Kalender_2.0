version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: kalender-db
    restart: always
    environment:
      - POSTGRES_DB=kalender
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    user: "999:999"  # 🔒 Erzwingt korrekte Ownerrechte im Container

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kalender-backend
    restart: always
    env_file:
      - ./.env  # 🔒 Immer das globale ENV-File aus dem Projekt-Root verwenden!
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - TZ=Europe/Zurich
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10s
    # 🚫 Codex darf diesen Block nie ändern:
    # DO NOT MODIFY - root .env mount and postgres volume protection are mandatory for stability.

  frontend:
    build:
      context: ./frontend
    container_name: kalender-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    container_name: kalender-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: kalender-certbot
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c '
      trap "exit 0" TERM;
      EMAIL_ARGS="";
      if [ -n "$CERTBOT_EMAIL" ]; then
        EMAIL_ARGS="--email $CERTBOT_EMAIL";
      else
        echo "[certbot] CERTBOT_EMAIL not set, registering without email";
        EMAIL_ARGS="--register-unsafely-without-email";
      fi;
      if [ ! -f /etc/letsencrypt/live/orgalifer.ch/fullchain.pem ]; then
        echo "[certbot] No existing certificate found, requesting initial certificate";
        certbot certonly --webroot -w /var/www/certbot -d orgalifer.ch $EMAIL_ARGS --agree-tos --non-interactive || true;
      fi;
      while :; do
        certbot renew;
        sleep 12h & wait $${!};
      done;'
    restart: unless-stopped

  monitor:
    image: docker:24-cli
    container_name: kalender-monitor
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
    entrypoint: ["/bin/sh", "-c", "while true; do /scripts/health_monitor.sh; sleep 120; done"]
    depends_on:
      - backend
