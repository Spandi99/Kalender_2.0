services:
  db:
    image: postgres:16-alpine
    container_name: kalender-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_xp
      TZ: Europe/Zurich
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: kalender-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/calendar_xp
      BACKEND_CORS_ORIGINS: '["http://localhost:8080", "http://192.168.1.136:8080"]'
      TZ: Europe/Zurich
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
    container_name: kalender-frontend
    depends_on:
      - backend
    environment:
      TZ: Europe/Zurich
    ports:
      - "8080:80"

volumes:
  postgres_data:
