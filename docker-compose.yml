version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: kalender-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_xp
      TZ: Europe/Zurich
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build: ./backend
    container_name: kalender-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/calendar_xp
      BACKEND_CORS_ORIGINS: '["https://orgalifer.ch","http://localhost:8080","http://192.168.1.136:8080"]'
      TZ: Europe/Zurich
    expose:
      - "8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: kalender-frontend
    environment:
      VITE_API_URL: "https://orgalifer.ch/api"
      TZ: Europe/Zurich
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: kalender-nginx
    depends_on:
      certbot-init:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command:
      - /bin/sh
      - -c
      - |
        while [ ! -f /etc/letsencrypt/live/orgalifer.ch/fullchain.pem ] || [ ! -f /etc/letsencrypt/live/orgalifer.ch/privkey.pem ]; do
          echo 'Waiting for TLS certificates...'
          sleep 2
        done
        nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    restart: always

  certbot-init:
    image: certbot/certbot
    container_name: kalender-certbot-init
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      CERTBOT_EMAIL: admin@orgalifer.ch
    ports:
      - "80:80"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /etc/letsencrypt/live/orgalifer.ch/fullchain.pem ]; then
          python3 -m http.server 80 --directory /var/www/certbot &
          server_pid=$!
          trap "kill $server_pid" EXIT
          certbot certonly --webroot -w /var/www/certbot --non-interactive --agree-tos --email "$CERTBOT_EMAIL" -d orgalifer.ch -d www.orgalifer.ch
        fi

  certbot:
    image: certbot/certbot
    container_name: kalender-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      CERTBOT_EMAIL: admin@orgalifer.ch
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap "exit 0" TERM
        while [ ! -f /etc/letsencrypt/live/orgalifer.ch/fullchain.pem ]; do
          echo "Waiting for initial certificate issuance..."
          sleep 30
        done
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h
        done
