services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_xp
      TZ: Europe/Zurich
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - kalnet

  backend:
    build: ./backend
    container_name: kalender-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/calendar_xp
      BACKEND_CORS_ORIGINS: '["http://orgalifer.ch", "https://orgalifer.ch", "http://localhost"]'
      TZ: Europe/Zurich
    expose:
      - "8000"
    networks:
      kalnet:
        aliases:
          - kalender-backend

  frontend:
    build: ./frontend
    expose:
      - "80"
    networks:
      - kalnet

  nginx:
    image: nginx:latest
    container_name: kalender-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    environment:
      TARGET_DIR: /var/cache/nginx/html-permissions
      TARGET_UID: "1000"
      TARGET_GID: "1000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/dist:/var/cache/nginx/html-permissions
      - ./scripts/fix_permissions.sh:/docker-entrypoint.d/10-fix-permissions.sh:ro
    networks:
      - kalnet

networks:
  kalnet:
    driver: bridge
