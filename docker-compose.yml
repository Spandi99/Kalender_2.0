version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: kalender-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_xp
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: kalender-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/calendar_xp
      BACKEND_CORS_ORIGINS: '["https://orgalifer.ch", "http://orgalifer.ch", "https://192.168.1.136", "http://192.168.1.136", "https://localhost", "http://localhost"]'
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: kalender-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    container_name: kalender-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: kalender-certbot
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c '
      trap "exit 0" TERM;
      EMAIL_ARGS="";
      if [ -n "$CERTBOT_EMAIL" ]; then
        EMAIL_ARGS="--email $CERTBOT_EMAIL";
      else
        echo "[certbot] CERTBOT_EMAIL not set, registering without email";
        EMAIL_ARGS="--register-unsafely-without-email";
      fi;
      if [ ! -f /etc/letsencrypt/live/orgalifer.ch/fullchain.pem ]; then
        echo "[certbot] No existing certificate found, requesting initial certificate";
        certbot certonly --webroot -w /var/www/certbot -d orgalifer.ch $EMAIL_ARGS --agree-tos --non-interactive || true;
      fi;
      while :; do
        certbot renew;
        sleep 12h & wait $${!};
      done;'
    restart: unless-stopped

  monitor:
    image: docker:24-cli
    container_name: kalender-monitor
    depends_on:
      - backend
      - nginx
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/health_monitor.sh:/app/scripts/health_monitor.sh:ro
    entrypoint: "/bin/sh -c 'apk add --no-cache curl >/dev/null && chmod +x /app/scripts/health_monitor.sh && /app/scripts/health_monitor.sh'"
    restart: unless-stopped
