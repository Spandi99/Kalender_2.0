version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: kalender-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_xp
      TZ: Europe/Zurich
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - kalender-net

  backend:
    build:
      context: ./backend
    container_name: kalender-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/calendar_xp
      BACKEND_CORS_ORIGINS: '["https://orgalifer.ch", "http://orgalifer.ch", "http://192.168.1.136:8080", "http://localhost:8080"]'
      TZ: Europe/Zurich
    expose:
      - "8000"
    networks:
      - kalender-net

  frontend:
    build:
      context: ./frontend
    container_name: kalender-frontend
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - kalender-net

  nginx:
    image: nginx:latest
    container_name: kalender-nginx
    depends_on:
      - frontend
      - backend
      - certbot
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/default-ssl.conf:/etc/nginx/conf.d/default-ssl.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - kalender-net

  certbot:
    image: certbot/certbot
    container_name: kalender-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/health_monitor.py:/usr/local/bin/health_monitor.py
    entrypoint: >
      sh -c "
        if [ ! -d /etc/letsencrypt/live/orgalifer.ch ]; then
          mkdir -p /etc/letsencrypt/live/orgalifer.ch;
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /etc/letsencrypt/live/orgalifer.ch/privkey.pem \
            -out /etc/letsencrypt/live/orgalifer.ch/fullchain.pem \
            -subj '/CN=orgalifer.ch';
        fi;
        certbot certonly --webroot -w /var/www/certbot \
          -d orgalifer.ch -d www.orgalifer.ch \
          --agree-tos --email admin@orgalifer.ch --no-eff-email || true;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          python3 /usr/local/bin/health_monitor.py;
          sleep 600;
        done;
      "

networks:
  kalender-net:
    driver: bridge
