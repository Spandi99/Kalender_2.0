services:
  db:
    image: postgres:16-alpine
    container_name: kalender-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_xp
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks: [kalnet]
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: kalender-backend
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/calendar_xp
      BACKEND_CORS_ORIGINS: '["https://orgalifer.ch", "http://orgalifer.ch", "http://localhost:8080"]'
      TZ: Europe/Zurich
    networks: [kalnet]
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: kalender-frontend
    depends_on: [backend]
    networks: [kalnet]
    ports:
      - "8080:80"

  nginx:
    image: nginx:latest
    container_name: kalender-nginx
    depends_on: [frontend, backend]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [kalnet]
    ports:
      - "80:80"

networks:
  kalnet:
    driver: bridge
