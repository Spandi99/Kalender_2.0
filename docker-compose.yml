services:
  db:
    image: postgres:16-alpine
    container_name: kalender-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_xp
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - kalender-net
    expose:
      - "5432"

  backend:
    build: ./backend
    container_name: kalender-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/calendar_xp
      BACKEND_CORS_ORIGINS: '["https://orgalifer.ch", "http://orgalifer.ch", "http://192.168.1.136:8080", "http://localhost:8080"]'
      TZ: Europe/Zurich
    expose:
      - "8000"
    networks:
      - kalender-net

  frontend:
    build: ./frontend
    container_name: kalender-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: "https://orgalifer.ch/api"
      TZ: Europe/Zurich
    networks:
      - kalender-net

  nginx:
    image: nginx:latest
    container_name: kalender-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - kalender-net

networks:
  kalender-net:
    driver: bridge
