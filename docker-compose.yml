services:
  db:
    image: postgres:16-alpine
    container_name: kalender-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_xp
      TZ: Europe/Zurich
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks: [kalnet]

  backend:
    build:
      context: ./backend
    container_name: kalender-backend
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/calendar_xp
      BACKEND_CORS_ORIGINS: '["http://localhost:8080","http://192.168.1.136:8080","https://orgalifer.ch","http://orgalifer.ch"]'
      TZ: Europe/Zurich
    ports:
      - "8000:8000"
    networks: [kalnet]
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
    container_name: kalender-frontend
    depends_on: [backend]
    environment:
      TZ: Europe/Zurich
    ports:
      - "8080:80"
    networks: [kalnet]

  nginx:
    image: nginx:latest
    container_name: kalender-nginx
    depends_on: [frontend, backend]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - kalnet

networks:
  kalnet:
    driver: bridge
