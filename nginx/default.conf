# HTTP → HTTPS redirect
server {
    listen 80;
    server_name orgalifer.ch www.orgalifer.ch;
    return 301 https://$host$request_uri;
}

# HTTPS main site
server {
    listen 443 ssl;
    server_name orgalifer.ch www.orgalifer.ch;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/orgalifer.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orgalifer.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;

    # API proxy
    location /api/ {
        proxy_pass http://kalender-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Health endpoint
    location /health {
        proxy_pass http://kalender-backend:8000/health;
    }

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Security & CORS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type';
}
