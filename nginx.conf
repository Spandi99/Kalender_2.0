# Global Nginx configuration for orgalifer.ch
# Provides HTTP to HTTPS redirection and secure reverse proxying for the
# Kalender 2.0 application stack.
events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    map $http_host $primary_host {
        default orgalifer.ch;
    }

    map $scheme $is_https {
        default 0;
        https 1;
    }

    # HTTP server also acts as graceful fallback when certificates are not available
    server {
        listen 80;
        listen [::]:80;
        server_name orgalifer.ch 192.168.1.136 localhost;

        set $cert_ready 0;
        if (-f /etc/letsencrypt/live/orgalifer.ch/fullchain.pem) {
            set $cert_ready 1;
        }

        if ($cert_ready = 1) {
            return 301 https://$host$request_uri;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://kalender-backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name orgalifer.ch 192.168.1.136 localhost;

        ssl_certificate /etc/letsencrypt/live/orgalifer.ch/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orgalifer.ch/privkey.pem;

        # Allow Certbot HTTP-01 challenges even when HTTPS is enforced
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://kalender-backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
