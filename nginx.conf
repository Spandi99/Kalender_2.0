# Global Nginx configuration for orgalifer.ch
# Provides HTTP to HTTPS redirection and secure reverse proxying for the
# Kalender 2.0 application stack.
events {}

http {
    include       mime.types;
    default_type  text/html;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name orgalifer.ch api.orgalifer.ch 192.168.1.136 localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name orgalifer.ch api.orgalifer.ch 192.168.1.136 localhost;
        http2 on;

        ssl_certificate /etc/letsencrypt/live/orgalifer.ch/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orgalifer.ch/privkey.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Allow Certbot HTTP-01 challenges even when HTTPS is enforced
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","source":"nginx"}';
        }

        location = /health/extended {
            proxy_pass http://backend:8000/health/extended;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
